name: budgetflow
description: A modern budget tracker app built with Flutter and Cubit.
publish_to: 'none'
version: 2.0.0+1

environment:
  # flutter_bloc ^9 requires Dart >=3.4; using ^ avoids the open upper bound
  # footgun while still accepting any future Dart 3.x patch release.
  sdk: '^3.4.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── State management ─────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1       # latest stable; BlocListener mounted-check fix included
  equatable: ^2.0.5          # stable, no newer version needed
  hydrated_bloc: ^10.1.1     # latest; aligns with flutter_bloc ^9 / bloc ^9

  # ── Storage & platform ───────────────────────────────────────────────────────
  path_provider: ^2.1.5      # patch bump: Android scoped-storage & iOS sandbox fixes

  # ── UI & fonts ───────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1       # fixes deprecated FontWeight.index; requires Flutter 3.29+
  flutter_animate: ^4.5.0    # latest stable; new ShimmerEffect + BlurEffect APIs
  percent_indicator: ^4.2.3  # stable; no breaking updates available
  font_awesome_flutter: ^10.8.0  # updated icon set; drop-in replacement for ^10.6

  # ── Utilities ────────────────────────────────────────────────────────────────
  uuid: ^4.5.1               # Dart 3.x optimised; v4/v7 UUIDs, no API changes
  intl: ^0.20.2              # aligns with Flutter SDK's own intl pin; latest stable

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  
  hive_generator: ^2.0.1      # needed for code gen
  build_runner: ^2.4.6        # needed for code gen   
flutter:
  uses-material-design: true